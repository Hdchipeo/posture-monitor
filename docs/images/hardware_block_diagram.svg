<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-3%" y="-4%" width="106%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow-hw" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#374151"/>
    </marker>
    <marker id="arrow-hw-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1D4ED8"/>
    </marker>
    <marker id="arrow-hw-gray" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9CA3AF"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="570" fill="#FFFFFF"/>
  <rect x="12" y="12" width="936" height="546" rx="8" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Diagram Title inside Box -->
  <text x="480" y="46" text-anchor="middle" font-family="'Times New Roman', serif" font-size="17" font-weight="bold" fill="#111827">SƠ ĐỒ KHỐI PHẦN CỨNG THIẾT BỊ GIÁM SÁT TƯ THẾ</text>
  <text x="480" y="66" text-anchor="middle" font-family="'Times New Roman', serif" font-size="12" fill="#6B7280">Cấu trúc các khối chức năng vật lý và luồng kết nối tín hiệu</text>

  <!-- ==================== KHỐI NGUỒN PIN & SẠC (TOP-CENTER) ==================== -->
  <g filter="url(#shadow)">
    <rect x="340" y="90" width="280" height="92" rx="6" fill="#F3F4F6" stroke="#4B5563" stroke-width="1.5"/>
    <rect x="340" y="90" width="280" height="26" rx="6" fill="#4B5563"/>
    <rect x="340" y="108" width="280" height="8" fill="#4B5563"/>
    <text x="480" y="108" text-anchor="middle" font-family="'Times New Roman', serif" font-size="13" font-weight="bold" fill="#FFFFFF">KHỐI NGUỒN VÀ QUẢN LÝ SẠC</text>
    <text x="480" y="134" text-anchor="middle" font-family="'Times New Roman', serif" font-size="11.5" fill="#1F2937">• Pin sạc dung lượng cao (Cấp nguồn toàn máy)</text>
    <text x="480" y="153" text-anchor="middle" font-family="'Times New Roman', serif" font-size="11.5" fill="#1F2937">• Cổng sạc chuẩn Type-C tiện lợi</text>
    <text x="480" y="172" text-anchor="middle" font-family="'Times New Roman', serif" font-size="11" fill="#4B5563">• Mạch bảo vệ sạc và ổn định điện áp</text>
  </g>

  <!-- ==================== KHỐI ĐIỀU KHIỂN TRUNG TÂM (CENTER) ==================== -->
  <g filter="url(#shadow)">
    <rect x="320" y="232" width="320" height="156" rx="8" fill="#FFFFFF" stroke="#111827" stroke-width="2"/>
    <rect x="320" y="232" width="320" height="30" rx="8" fill="#1F2937"/>
    <rect x="320" y="252" width="320" height="10" fill="#1F2937"/>
    <text x="480" y="253" text-anchor="middle" font-family="'Times New Roman', serif" font-size="13.5" font-weight="bold" fill="#FFFFFF">BỘ ĐIỀU KHIỂN TRUNG TÂM</text>
    
    <text x="480" y="286" text-anchor="middle" font-family="'Times New Roman', serif" font-size="12" font-weight="bold" fill="#1F2937">Bộ Vi Xử Lý &amp; Phát Sóng Không Dây</text>
    <text x="480" y="309" text-anchor="middle" font-family="'Times New Roman', serif" font-size="11" fill="#374151">• Tiếp nhận dữ liệu góc nghiêng cơ thể liên tục</text>
    <text x="480" y="327" text-anchor="middle" font-family="'Times New Roman', serif" font-size="11" fill="#374151">• Thuật toán nhận diện gù lưng và lệch vai</text>
    <text x="480" y="345" text-anchor="middle" font-family="'Times New Roman', serif" font-size="11" fill="#374151">• Điều khiển nhịp rung, đèn báo và còi nhắc nhở</text>
    <text x="480" y="363" text-anchor="middle" font-family="'Times New Roman', serif" font-size="11" fill="#4B5563">• Phát sóng mạng Wi-Fi cục bộ kết nối thiết bị</text>
  </g>

  <!-- ==================== KHỐI CẢM BIẾN (LEFT) ==================== -->
  <g filter="url(#shadow)">
    <rect x="40" y="248" width="220" height="124" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
    <rect x="40" y="248" width="220" height="26" rx="6" fill="#374151"/>
    <rect x="40" y="266" width="220" height="8" fill="#374151"/>
    <text x="150" y="266" text-anchor="middle" font-family="'Times New Roman', serif" font-size="12.5" font-weight="bold" fill="#FFFFFF">KHỐI CẢM BIẾN GÓC NGHIÊNG</text>
    <text x="150" y="296" text-anchor="middle" font-family="'Times New Roman', serif" font-size="11.5" fill="#1F2937">• Cảm biến đo chuyển động</text>
    <text x="150" y="316" text-anchor="middle" font-family="'Times New Roman', serif" font-size="11.5" fill="#1F2937">• Theo dõi góc cúi / ngửa lưng</text>
    <text x="150" y="336" text-anchor="middle" font-family="'Times New Roman', serif" font-size="11.5" fill="#1F2937">• Theo dõi góc nghiêng hai vai</text>
    <text x="150" y="356" text-anchor="middle" font-family="'Times New Roman', serif" font-size="11" fill="#4B5563">• Theo dõi góc xoay thân người</text>
  </g>

  <!-- ==================== KHỐI NÚT BẤM VẬT LÝ (BOTTOM-LEFT) ==================== -->
  <g filter="url(#shadow)">
    <rect x="140" y="440" width="210" height="92" rx="6" fill="#F9FAFB" stroke="#6B7280" stroke-width="1.2"/>
    <rect x="140" y="440" width="210" height="24" rx="6" fill="#4B5563"/>
    <rect x="140" y="456" width="210" height="8" fill="#4B5563"/>
    <text x="245" y="457" text-anchor="middle" font-family="'Times New Roman', serif" font-size="12" font-weight="bold" fill="#FFFFFF">NÚT BẤM VẬT LÝ ĐƠN</text>
    <text x="245" y="483" text-anchor="middle" font-family="'Times New Roman', serif" font-size="11" fill="#1F2937">• Bấm 1 lần: Tắt rung nhanh</text>
    <text x="245" y="501" text-anchor="middle" font-family="'Times New Roman', serif" font-size="11" fill="#1F2937">• Bấm đúp: Tạm dừng 10 phút</text>
    <text x="245" y="519" text-anchor="middle" font-family="'Times New Roman', serif" font-size="11" fill="#1F2937">• Giữ 2 giây: Hiệu chuẩn dáng ngồi</text>
  </g>

  <!-- ==================== KHỐI ĐO PIN (BOTTOM-CENTER) ==================== -->
  <g filter="url(#shadow)">
    <rect x="385" y="440" width="180" height="80" rx="6" fill="#F9FAFB" stroke="#6B7280" stroke-width="1.2"/>
    <rect x="385" y="440" width="180" height="24" rx="6" fill="#4B5563"/>
    <rect x="385" y="456" width="180" height="8" fill="#4B5563"/>
    <text x="475" y="457" text-anchor="middle" font-family="'Times New Roman', serif" font-size="12" font-weight="bold" fill="#FFFFFF">MẠCH ĐO MỨC PIN</text>
    <text x="475" y="485" text-anchor="middle" font-family="'Times New Roman', serif" font-size="11" fill="#1F2937">• Đo điện áp pin chính xác</text>
    <text x="475" y="504" text-anchor="middle" font-family="'Times New Roman', serif" font-size="11" fill="#4B5563">• Báo pin yếu lên đèn &amp; web</text>
  </g>

  <!-- ==================== KHỐI CẢNH BÁO PHẢN HỒI (RIGHT) ==================== -->
  <g filter="url(#shadow)">
    <rect x="700" y="210" width="220" height="162" rx="6" fill="#F9FAFB" stroke="#4B5563" stroke-width="1.5"/>
    <rect x="700" y="210" width="220" height="26" rx="6" fill="#374151"/>
    <rect x="700" y="228" width="220" height="8" fill="#374151"/>
    <text x="810" y="228" text-anchor="middle" font-family="'Times New Roman', serif" font-size="12.5" font-weight="bold" fill="#FFFFFF">CẢNH BÁO &amp; PHẢN HỒI</text>
    <text x="810" y="256" text-anchor="middle" font-family="'Times New Roman', serif" font-size="11.5" font-weight="bold" fill="#1F2937">1. Động cơ rung xúc giác</text>
    <text x="810" y="274" text-anchor="middle" font-family="'Times New Roman', serif" font-size="10.5" fill="#4B5563">Nhắc nhở nhẹ nhàng khi gù lưng</text>
    <text x="810" y="298" text-anchor="middle" font-family="'Times New Roman', serif" font-size="11.5" font-weight="bold" fill="#1F2937">2. Đèn báo trạng thái</text>
    <text x="810" y="316" text-anchor="middle" font-family="'Times New Roman', serif" font-size="10.5" fill="#4B5563">Chớp theo nhịp thông báo chế độ</text>
    <text x="810" y="340" text-anchor="middle" font-family="'Times New Roman', serif" font-size="11.5" font-weight="bold" fill="#1F2937">3. Còi cảnh báo âm thanh</text>
    <text x="810" y="358" text-anchor="middle" font-family="'Times New Roman', serif" font-size="10.5" fill="#4B5563">Báo động khi sai tư thế kéo dài</text>
  </g>

  <!-- ==================== THIẾT BỊ HIỂN THỊ DI ĐỘNG (BOTTOM-RIGHT) ==================== -->
  <g filter="url(#shadow)">
    <rect x="650" y="420" width="270" height="116" rx="6" fill="#FFFFFF" stroke="#374151" stroke-width="1.5"/>
    <rect x="650" y="420" width="270" height="24" rx="6" fill="#4B5563"/>
    <rect x="650" y="436" width="270" height="8" fill="#4B5563"/>
    <text x="785" y="437" text-anchor="middle" font-family="'Times New Roman', serif" font-size="12" font-weight="bold" fill="#FFFFFF">ĐIỆN THOẠI / MÁY TÍNH CÁ NHÂN</text>
    <text x="785" y="462" text-anchor="middle" font-family="'Times New Roman', serif" font-size="11" font-weight="bold" fill="#1F2937">Trang Web Giám Sát (Web Monitor)</text>
    <text x="785" y="480" text-anchor="middle" font-family="'Times New Roman', serif" font-size="10.5" fill="#374151">• Xem mô hình 3D cột sống theo thời gian thực</text>
    <text x="785" y="498" text-anchor="middle" font-family="'Times New Roman', serif" font-size="10.5" fill="#374151">• Điểm số tư thế, thống kê lịch sử trong ngày</text>
    <text x="785" y="516" text-anchor="middle" font-family="'Times New Roman', serif" font-size="10.5" fill="#4B5563">• Hiệu chuẩn và nạp phần mềm không dây</text>
  </g>

  <!-- ==================== CÁC ĐƯỜNG KẾT NỐI VÀ MŨI TÊN ==================== -->

  <!-- Nguồn Pin -> Điều khiển trung tâm -->
  <line x1="480" y1="182" x2="480" y2="228" stroke="#374151" stroke-width="2" marker-end="url(#arrow-hw)"/>
  <rect x="420" y="196" width="120" height="18" rx="3" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="480" y="209" text-anchor="middle" font-family="'Times New Roman', serif" font-size="10" font-weight="bold" fill="#4B5563">Cung cấp nguồn 3.3V</text>

  <!-- Cảm biến -> Điều khiển trung tâm -->
  <line x1="260" y1="310" x2="316" y2="310" stroke="#374151" stroke-width="2" marker-end="url(#arrow-hw)"/>
  <rect x="264" y="291" width="50" height="16" rx="2" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="289" y="303" text-anchor="middle" font-family="'Times New Roman', serif" font-size="9.5" fill="#4B5563">Góc đo</text>

  <!-- Nút bấm -> Điều khiển trung tâm -->
  <path d="M 245 440 L 245 365 L 316 365" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow-hw)"/>
  <rect x="248" y="351" width="60" height="16" rx="2" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="278" y="363" text-anchor="middle" font-family="'Times New Roman', serif" font-size="9" fill="#4B5563">Lệnh nhấn</text>

  <!-- Mạch đo pin -> Điều khiển trung tâm -->
  <line x1="475" y1="440" x2="475" y2="392" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow-hw)"/>
  <rect x="440" y="408" width="70" height="16" rx="2" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="475" y="420" text-anchor="middle" font-family="'Times New Roman', serif" font-size="9" fill="#4B5563">Mức pin</text>

  <!-- Pin -> Mạch đo pin (dây nhánh cấp đo) -->
  <path d="M 360 182 L 360 480 L 381 480" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-hw-gray)"/>

  <!-- Điều khiển trung tâm -> Cảnh báo phản hồi -->
  <line x1="640" y1="290" x2="696" y2="290" stroke="#374151" stroke-width="2" marker-end="url(#arrow-hw)"/>
  <rect x="644" y="271" width="50" height="16" rx="2" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="669" y="283" text-anchor="middle" font-family="'Times New Roman', serif" font-size="9.5" fill="#4B5563">Kích hoạt</text>

  <!-- Điều khiển trung tâm -> Thiết bị hiển thị (Sóng Wi-Fi đường đi sạch sẽ ở dưới) -->
  <path d="M 590 388 L 590 478 L 646 478" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-hw-blue)"/>
  <rect x="580" y="445" width="60" height="28" rx="3" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="610" y="458" text-anchor="middle" font-family="'Times New Roman', serif" font-size="9" font-weight="bold" fill="#1D4ED8">Sóng Wi-Fi</text>
  <text x="610" y="469" text-anchor="middle" font-family="'Times New Roman', serif" font-size="8.5" fill="#1E40AF">cục bộ</text>

</svg>
